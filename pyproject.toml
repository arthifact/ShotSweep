[project]
name = "shotsweep"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cuda = ["torch==2.14.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
